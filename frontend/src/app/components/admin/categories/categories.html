<div class="space-y-6">
  <div class="flex justify-between items-center pb-3 border-b border-slate-100 dark:border-slate-800">
    <h2 class="text-lg font-black uppercase text-slate-850 dark:text-slate-100 tracking-tight">Category Catalog</h2>
    <button *ngIf="!formOpen()" (click)="openAddForm()" class="px-5 py-2 bg-indigo-600 hover:bg-indigo-700 text-white text-xs font-black uppercase tracking-wider rounded-full shadow-sm cursor-pointer">
      Add Category
    </button>
  </div>

  <!-- Form -->
  <div *ngIf="formOpen()" class="glass-panel p-6 rounded-3xl border border-indigo-400/30 bg-slate-50/40 dark:bg-slate-950/20 space-y-4 animate-fade-in">
    <h3 class="text-sm font-black text-slate-800 dark:text-slate-100 uppercase">{{ editMode() ? 'Edit' : 'Create' }} Category</h3>
    
    <form (submit)="handleSave($event)" class="grid grid-cols-1 sm:grid-cols-3 gap-4">
      <div>
        <label class="block text-[9px] font-black text-slate-450 uppercase mb-1">Category Name</label>
        <input type="text" [(ngModel)]="name" name="name" required placeholder="e.g. Graphic Cards" class="w-full bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-850 rounded-xl py-2 px-3 text-xs font-semibold focus:outline-none focus:ring-2 focus:ring-indigo-600 text-slate-800 dark:text-slate-100" />
      </div>

      <div>
        <label class="block text-[9px] font-black text-slate-450 uppercase mb-1">URL Slug</label>
        <input type="text" [(ngModel)]="slug" name="slug" required placeholder="e.g. graphics-cards" class="w-full bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-850 rounded-xl py-2 px-3 text-xs font-semibold focus:outline-none focus:ring-2 focus:ring-indigo-600 text-slate-800 dark:text-slate-100" />
      </div>

      <div>
        <label class="block text-[9px] font-black text-slate-450 uppercase mb-1">Image Path / URL (Optional)</label>
        <input type="text" [(ngModel)]="image" name="image" placeholder="e.g. /uploads/cat_gpu.jpg" class="w-full bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-850 rounded-xl py-2 px-3 text-xs font-semibold focus:outline-none focus:ring-2 focus:ring-indigo-600 text-slate-800 dark:text-slate-100" />
      </div>

      <div class="sm:col-span-3 flex items-center space-x-3 pt-2">
        <button type="submit" class="px-5 py-2 bg-indigo-600 hover:bg-indigo-700 text-white text-[10px] font-black uppercase tracking-wider rounded-full shadow-md cursor-pointer">
          Save Category
        </button>
        <button type="button" (click)="closeForm()" class="px-5 py-2 border border-slate-200 dark:border-slate-800 text-slate-500 hover:bg-slate-100 dark:text-slate-400 dark:hover:bg-slate-800/60 text-[10px] font-black uppercase tracking-wider rounded-full cursor-pointer">
          Cancel
        </button>
      </div>
    </form>
  </div>

  <!-- Loading State -->
  <div *ngIf="loading()" class="h-48 flex flex-col items-center justify-center space-y-2">
    <svg class="animate-spin h-6 w-6 text-indigo-600" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
      <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
      <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
    </svg>
    <span class="text-[9px] text-slate-400 font-black tracking-widest uppercase">Fetching categories...</span>
  </div>

  <!-- Table list -->
  <div *ngIf="!loading() && categories().length > 0 && !formOpen()" class="glass-panel overflow-hidden rounded-2xl shadow-xs border border-slate-200/50">
    <div class="overflow-x-auto">
      <table class="min-w-full divide-y divide-slate-100 dark:divide-slate-800/60 text-xs font-semibold text-left">
        <thead class="bg-slate-50 dark:bg-slate-900/60 text-slate-400 dark:text-slate-500 uppercase font-black text-[9px] tracking-wider">
          <tr>
            <th class="py-3 px-4">Name</th>
            <th class="py-3 px-4">Slug</th>
            <th class="py-3 px-4">Image Banner</th>
            <th class="py-3 px-4 text-right">Actions</th>
          </tr>
        </thead>
        <tbody class="divide-y divide-slate-100 dark:divide-slate-800/60 text-slate-700 dark:text-slate-300">
          <tr *ngFor="let cat of categories()" class="hover:bg-slate-50/50 dark:hover:bg-slate-800/5">
            <td class="py-3 px-4 font-bold text-slate-800 dark:text-slate-100">{{ cat.name }}</td>
            <td class="py-3 px-4 font-mono">{{ cat.slug }}</td>
            <td class="py-3 px-4 text-slate-400 text-[10px] truncate max-w-[200px]" [title]="cat.image">{{ cat.image || 'N/A' }}</td>
            <td class="py-3 px-4 text-right space-x-3 text-[10px] font-black uppercase tracking-wider">
              <button (click)="openEditForm(cat)" class="text-indigo-600 hover:underline cursor-pointer">Edit</button>
              <button (click)="handleDelete(cat.id)" class="text-rose-500 hover:underline cursor-pointer">Delete</button>
            </td>
          </tr>
        </tbody>
      </table>
    </div>
  </div>

  <div *ngIf="!loading() && categories().length === 0 && !formOpen()" class="text-center py-12 text-slate-400 font-black uppercase text-xs">
    No categories found. Click Add Category to create one.
  </div>
</div>
