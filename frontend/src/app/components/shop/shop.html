<div class="min-h-screen bg-transparent pt-24 pb-16">
  <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
    
    <!-- Title header -->
    <div class="border-b border-slate-200 dark:border-slate-800/80 pb-4 mb-8">
      <h1 class="text-3xl font-black text-slate-800 dark:text-slate-100 uppercase tracking-tight">
        Sri Pavan Electronics Catalog
      </h1>
      <p class="text-xs text-slate-400 dark:text-slate-500 mt-1 uppercase font-semibold tracking-wider">
        Browse premium computer hardware & components in Kakinada
      </p>
    </div>

    <div class="grid grid-cols-1 lg:grid-cols-4 gap-8">
      
      <!-- Sidebar Filters (Desktop) -->
      <aside class="space-y-6 lg:col-span-1">
        <div class="glass-panel p-6 rounded-[2rem] shadow-sm space-y-6">
          <div class="flex items-center justify-between border-b border-slate-100 dark:border-slate-800/80 pb-3">
            <h2 class="text-sm font-black uppercase tracking-wider text-slate-800 dark:text-slate-100">{{ t().filters }}</h2>
            <button (click)="resetFilters()" class="text-xs text-indigo-600 dark:text-indigo-400 hover:text-indigo-800 dark:hover:text-indigo-300 font-bold cursor-pointer">
              Reset All
            </button>
          </div>

          <!-- Category filter -->
          <div class="space-y-2">
            <label class="text-xs font-black uppercase tracking-widest text-slate-500 dark:text-slate-400 block">{{ t().category }}</label>
            <select
              [(ngModel)]="selectedCategory"
              (change)="applyFilters()"
              class="w-full bg-slate-50 dark:bg-slate-900 border border-slate-200 dark:border-slate-800 dark:text-slate-100 rounded-xl px-3 py-2 text-xs font-semibold focus:outline-none focus:ring-1 focus:ring-indigo-500"
            >
              <option value="">{{ t().all }} Categories</option>
              <option *ngFor="let cat of categories()" [value]="cat.slug">{{ cat.name }}</option>
            </select>
          </div>

          <!-- Brand filter -->
          <div class="space-y-2">
            <label class="text-xs font-black uppercase tracking-widest text-slate-500 dark:text-slate-400 block">{{ t().brand }}</label>
            <select
              [(ngModel)]="selectedBrand"
              (change)="applyFilters()"
              class="w-full bg-slate-50 dark:bg-slate-900 border border-slate-200 dark:border-slate-800 dark:text-slate-100 rounded-xl px-3 py-2 text-xs font-semibold focus:outline-none focus:ring-1 focus:ring-indigo-500"
            >
              <option value="">{{ t().all }} Brands</option>
              <option *ngFor="let br of brands()" [value]="br.slug">{{ br.name }}</option>
            </select>
          </div>

          <!-- Price range filter -->
          <div class="space-y-3">
            <label class="text-xs font-black uppercase tracking-widest text-slate-500 dark:text-slate-400 block">
              Max Price: ₹{{ maxPrice().toLocaleString('en-IN') }}
            </label>
            <input
              type="range"
              [(ngModel)]="maxPrice"
              (change)="applyFilters()"
              min="0"
              max="200000"
              step="1000"
              class="w-full accent-indigo-600 dark:accent-indigo-400 h-1.5 bg-slate-200 dark:bg-slate-800 rounded-lg appearance-none cursor-pointer"
            />
            <div class="flex justify-between text-[10px] text-slate-400 dark:text-slate-500 font-bold">
              <span>₹0</span>
              <span>₹2,00,000+</span>
            </div>
          </div>

          <!-- Stock status filter -->
          <div class="flex items-center space-x-2">
            <input
              type="checkbox"
              id="inStockCheck"
              [(ngModel)]="inStockOnly"
              (change)="applyFilters()"
              class="rounded text-indigo-600 focus:ring-indigo-500 w-4 h-4 cursor-pointer accent-indigo-600"
            />
            <label for="inStockCheck" class="text-xs font-bold text-slate-600 dark:text-slate-300 cursor-pointer">
              {{ t().inStock }} Only
            </label>
          </div>
        </div>
      </aside>

      <!-- Products Listing Area -->
      <main class="lg:col-span-3 space-y-6">
        
        <!-- Search & Sort bar -->
        <div class="glass-panel p-4 rounded-3xl shadow-sm flex flex-col sm:flex-row items-center justify-between gap-4 border border-slate-200/60 dark:border-slate-800">
          <!-- Active filters details -->
          <div class="text-xs font-extrabold text-slate-500 dark:text-slate-400 uppercase tracking-wider">
            Showing {{ products().length }} products
          </div>

          <!-- Sort dropdown -->
          <div class="flex items-center space-x-2">
            <label class="text-xs font-bold text-slate-400 dark:text-slate-500 uppercase tracking-widest">Sort:</label>
            <select
              [ngModel]="sortBy()"
              (ngModelChange)="onSortChange($event)"
              class="bg-slate-50 dark:bg-slate-900 border border-slate-200 dark:border-slate-800 dark:text-slate-100 rounded-lg px-2.5 py-1.5 text-xs font-bold focus:outline-none focus:ring-1 focus:ring-indigo-500"
            >
              <option value="createdAt">Newest Arrivals</option>
              <option value="price_asc">{{ t().priceLowHigh }}</option>
              <option value="price_desc">{{ t().priceHighLow }}</option>
              <option value="rating">{{ t().ratingHighLow }}</option>
            </select>
          </div>
        </div>

        <!-- Skeleton Loading state -->
        <div *ngIf="loading()" class="grid grid-cols-1 sm:grid-cols-2 xl:grid-cols-3 gap-8">
          <div *ngFor="let item of [1, 2, 3, 4, 5, 6]" class="bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 rounded-[2rem] p-5 space-y-4 animate-pulse shadow-sm">
            <div class="w-full h-48 bg-slate-200 dark:bg-slate-800 rounded-2xl"></div>
            <div class="space-y-3">
              <div class="h-4 bg-slate-200 dark:bg-slate-800 rounded-md w-3/4"></div>
              <div class="h-3 bg-slate-200 dark:bg-slate-800 rounded-md w-1/2"></div>
              <div class="flex items-center justify-between pt-4">
                <div class="h-6 bg-slate-200 dark:bg-slate-800 rounded-md w-1/3"></div>
                <div class="h-8 bg-slate-200 dark:bg-slate-800 rounded-full w-1/4"></div>
              </div>
            </div>
          </div>
        </div>

        <!-- Products List Grid -->
        <ng-container *ngIf="!loading()">
          <div *ngIf="products().length > 0; else emptyTpl" class="space-y-8">
            <div class="grid grid-cols-1 sm:grid-cols-2 xl:grid-cols-3 gap-8">
              <div *ngFor="let prod of products()">
                <app-product-card [product]="prod"></app-product-card>
              </div>
            </div>

            <!-- Pagination Controls -->
            <div *ngIf="totalPages() > 1" class="flex items-center justify-center space-x-2 pt-6">
              <button
                [disabled]="currentPage() === 1"
                (click)="goToPage(currentPage() - 1)"
                class="px-4 py-2 bg-slate-100 hover:bg-slate-200 disabled:opacity-50 text-slate-700 dark:bg-slate-900 dark:hover:bg-slate-800 dark:text-slate-300 font-black text-xs uppercase tracking-wider rounded-xl transition-all border border-slate-200/50 dark:border-slate-800 cursor-pointer"
              >
                Prev
              </button>
              
              <span class="text-xs font-black text-slate-500 uppercase tracking-widest px-4">
                Page {{ currentPage() }} of {{ totalPages() }}
              </span>

              <button
                [disabled]="currentPage() === totalPages()"
                (click)="goToPage(currentPage() + 1)"
                class="px-4 py-2 bg-slate-100 hover:bg-slate-200 disabled:opacity-50 text-slate-700 dark:bg-slate-900 dark:hover:bg-slate-800 dark:text-slate-300 font-black text-xs uppercase tracking-wider rounded-xl transition-all border border-slate-200/50 dark:border-slate-800 cursor-pointer"
              >
                Next
              </button>
            </div>
          </div>

          <!-- Empty catalog state -->
          <ng-template #emptyTpl>
            <div class="glass-panel p-12 text-center space-y-4 shadow-xs">
              <svg xmlns="http://www.w3.org/2000/svg" width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" class="text-slate-300 dark:text-slate-600 mx-auto"><circle cx="12" cy="12" r="10"></circle><line x1="8" y1="12" x2="16" y2="12"></line></svg>
              <h3 class="text-lg font-black text-slate-800 dark:text-slate-200 uppercase tracking-tight">No products found</h3>
              <p class="text-xs text-slate-400 dark:text-slate-500 font-semibold uppercase tracking-wider">
                Try widening your price range or selection filters
              </p>
              <button (click)="resetFilters()" class="px-6 py-2.5 bg-indigo-600 text-white text-xs font-black uppercase tracking-wider rounded-full shadow-md hover:bg-indigo-700 transition-all cursor-pointer">
                Clear Filters
              </button>
            </div>
          </ng-template>
        </ng-container>

      </main>

    </div>
  </div>
</div>
