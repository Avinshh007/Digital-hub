<div class="min-h-screen bg-transparent pt-24 pb-16 px-4 sm:px-6 lg:px-8">
  <div class="max-w-xl mx-auto">
    
    <!-- Service Booking Header -->
    <div class="border-b border-slate-200 dark:border-slate-800/80 pb-4 mb-8 text-center sm:text-left">
      <h1 class="text-3xl font-black text-slate-800 dark:text-slate-100 uppercase tracking-tight">Book Repair Service</h1>
      <p class="text-xs text-slate-400 dark:text-slate-500 mt-1 uppercase font-semibold tracking-wider">
        Chip-level diagnostics and onsite support for desktops, laptops, and printer accessories
      </p>
    </div>

    <!-- Booking Card Form -->
    <div class="glass-panel p-8 sm:p-10 rounded-[2.5rem] shadow-xl relative overflow-hidden">
      <div class="absolute top-0 right-0 w-24 h-24 bg-indigo-500/5 rounded-bl-full pointer-events-none"></div>

      <!-- Messages -->
      <div *ngIf="error()" class="bg-rose-50 dark:bg-rose-950/20 border border-rose-100 dark:border-rose-900/40 text-rose-600 dark:text-rose-400 p-4 rounded-2xl text-xs font-semibold mb-6 animate-fade-in">
        {{ error() }}
      </div>
      <div *ngIf="success()" class="bg-emerald-50 dark:bg-emerald-950/20 border border-emerald-100 dark:border-emerald-900/40 text-emerald-800 dark:text-emerald-400 p-4 rounded-2xl text-xs font-semibold mb-6 animate-fade-in">
        {{ success() }}
      </div>

      <form (submit)="handleBooking($event)" class="space-y-6">
        <div class="grid grid-cols-1 sm:grid-cols-2 gap-6">
          <div>
            <label class="block text-[10px] font-black text-slate-400 dark:text-slate-500 uppercase tracking-widest mb-2">Customer Name</label>
            <input
              type="text"
              [(ngModel)]="customerName"
              name="customerName"
              required
              placeholder="e.g. Avinash"
              class="w-full bg-slate-100/50 dark:bg-slate-900/50 border border-slate-200 dark:border-slate-800 rounded-2xl py-3 px-4 text-sm font-semibold focus:outline-none focus:ring-2 focus:ring-indigo-600 text-slate-800 dark:text-slate-100 transition-all placeholder-slate-400"
            />
          </div>

          <div>
            <label class="block text-[10px] font-black text-slate-400 dark:text-slate-500 uppercase tracking-widest mb-2">Mobile Number</label>
            <input
              type="tel"
              [(ngModel)]="mobileNumber"
              name="mobileNumber"
              required
              placeholder="10-digit number"
              class="w-full bg-slate-100/50 dark:bg-slate-900/50 border border-slate-200 dark:border-slate-800 rounded-2xl py-3 px-4 text-sm font-semibold focus:outline-none focus:ring-2 focus:ring-indigo-600 text-slate-800 dark:text-slate-100 transition-all placeholder-slate-400"
            />
          </div>
        </div>

        <div class="grid grid-cols-1 sm:grid-cols-2 gap-6">
          <div>
            <label class="block text-[10px] font-black text-slate-400 dark:text-slate-500 uppercase tracking-widest mb-2">Device / Issue Category</label>
            <select
              [(ngModel)]="deviceType"
              name="deviceType"
              class="w-full bg-slate-100/50 dark:bg-slate-900/50 border border-slate-200 dark:border-slate-800 rounded-2xl py-3 px-4 text-sm font-semibold focus:outline-none focus:ring-2 focus:ring-indigo-600 text-slate-800 dark:text-slate-100 transition-all"
            >
              <option value="LAPTOP">Laptop Repair</option>
              <option value="DESKTOP">Desktop Computer Repair</option>
              <option value="PRINTER">Printer Diagnostics</option>
              <option value="NETWORKING">Networking Equipment Setup</option>
              <option value="UPGRADE">Hardware Upgrades (SSD/RAM)</option>
              <option value="HOMESERVICE">Home Service Request</option>
            </select>
          </div>

          <div>
            <label class="block text-[10px] font-black text-slate-400 dark:text-slate-500 uppercase tracking-widest mb-2">Preferred Appointment Date</label>
            <input
              type="date"
              [(ngModel)]="preferredDate"
              name="preferredDate"
              required
              class="w-full bg-slate-100/50 dark:bg-slate-900/50 border border-slate-200 dark:border-slate-800 rounded-2xl py-3 px-4 text-sm font-semibold focus:outline-none focus:ring-2 focus:ring-indigo-600 text-slate-800 dark:text-slate-100 transition-all"
            />
          </div>
        </div>

        <div>
          <label class="block text-[10px] font-black text-slate-400 dark:text-slate-500 uppercase tracking-widest mb-2">Problem Description / Custom Requirements</label>
          <textarea
            [(ngModel)]="problemDescription"
            name="problemDescription"
            required
            rows="4"
            placeholder="Please detail your hardware symptoms, brand details, or custom requirements..."
            class="w-full bg-slate-100/50 dark:bg-slate-900/50 border border-slate-200 dark:border-slate-800 rounded-2xl py-3 px-4 text-sm font-semibold focus:outline-none focus:ring-2 focus:ring-indigo-600 text-slate-800 dark:text-slate-100 transition-all placeholder-slate-400 resize-none"
          ></textarea>
        </div>

        <button
          type="submit"
          [disabled]="loading()"
          class="w-full py-4 bg-indigo-600 hover:bg-indigo-700 disabled:bg-indigo-400 text-white text-xs font-black uppercase tracking-widest rounded-full shadow-lg hover:shadow-indigo-500/10 transition-all cursor-pointer flex items-center justify-center space-x-2"
        >
          <span *ngIf="!loading()">Submit Service Booking</span>
          <span *ngIf="loading()">Scheduling...</span>
        </button>
      </form>

    </div>
  </div>
</div>
