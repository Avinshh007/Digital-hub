<div class="min-h-screen bg-transparent pt-24 pb-16 px-4 sm:px-6 lg:px-8">
  <div class="max-w-6xl mx-auto">
    <!-- Header -->
    <div class="border-b border-slate-200 dark:border-slate-800/80 pb-6 mb-12 text-center sm:text-left flex flex-col sm:flex-row justify-between items-center gap-6">
      <div>
        <h1 class="text-4xl font-black text-slate-800 dark:text-slate-100 uppercase tracking-tight">Services & Support</h1>
        <p class="text-xs text-slate-400 dark:text-slate-500 mt-1.5 uppercase font-semibold tracking-wider">
          Enterprise hardware diagnostics, computer repairs, CCTV setups, and network support
        </p>
      </div>
      <div class="flex items-center gap-4">
        <a
          routerLink="/services/book"
          class="px-6 py-3 bg-indigo-600 hover:bg-indigo-700 text-white text-xs font-black uppercase tracking-widest rounded-full shadow-lg hover:shadow-indigo-500/10 transition-all cursor-pointer"
        >
          Book Service
        </a>
        <a
          routerLink="/services/track"
          class="px-6 py-3 bg-slate-200 hover:bg-slate-350 dark:bg-slate-800 dark:hover:bg-slate-700 text-slate-700 dark:text-slate-200 text-xs font-black uppercase tracking-widest rounded-full transition-all cursor-pointer"
        >
          Track Repair
        </a>
      </div>
    </div>

    <!-- Service Grid -->
    <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-8">
      <div
        *ngFor="let service of services"
        class="glass-panel p-8 rounded-[2.5rem] shadow-xl relative overflow-hidden transition-all duration-300 hover:scale-[1.02] flex flex-col justify-between"
      >
        <div class="absolute top-0 right-0 w-24 h-24 bg-indigo-500/5 rounded-bl-full pointer-events-none"></div>

        <div>
          <!-- Icon -->
          <div class="w-12 h-12 rounded-2xl bg-indigo-50 dark:bg-indigo-950/40 flex items-center justify-center text-indigo-650 mb-6">
            <!-- Laptop Icon -->
            <svg *ngIf="service.icon === 'laptop'" class="w-6 h-6" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M9 17.25v1.007a3 3 0 01-.879 2.122L7.5 21h9l-.621-.621A3 3 0 0115 18.257V17.25m6-12V15a2.25 2.25 0 01-2.25 2.25H5.25A2.25 2.25 0 013 15V5.25m18 0A2.25 2.25 0 0018.75 3H5.25A2.25 2.25 0 003 5.25m18 0V12a2.25 2.25 0 01-2.25 2.25H5.25A2.25 2.25 0 013 12V5.25" /></svg>
            <!-- Monitor Icon -->
            <svg *ngIf="service.icon === 'monitor'" class="w-6 h-6" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M9 17.25v1.007a3 3 0 01-.879 2.122L7.5 21h9l-.621-.621A3 3 0 0115 18.257V17.25m6-12V15a2.25 2.25 0 01-2.25 2.25H5.25A2.25 2.25 0 013 15V5.25m18 0A2.25 2.25 0 0018.75 3H5.25A2.25 2.25 0 003 5.25m18 0V12a2.25 2.25 0 01-2.25 2.25H5.25A2.25 2.25 0 013 12V5.25" /></svg>
            <!-- Printer Icon -->
            <svg *ngIf="service.icon === 'printer'" class="w-6 h-6" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M6.72 13.829c-.24.03-.48.062-.72.096m.72-.096a42.415 42.415 0 0110.56 0m-10.56 0L6.34 18m10.94-4.171c.24.03.48.062.72.096m-.72-.096L17.66 18m0 0l.229 1.258a1.791 1.791 0 01-1.753 2.112H7.864a1.791 1.791 0 01-1.753-2.112L6.34 18M9 9V5.25A2.25 2.25 0 0111.25 3h1.5A2.25 2.25 0 0115 5.25V9m-9 3h12a2.25 2.25 0 012.25 2.25v1.318a2.25 2.25 0 01-1.414 2.088l-1.558.623a2.25 2.25 0 01-1.658 0l-1.558-.623a2.25 2.25 0 00-1.658 0l-1.558.623a2.25 2.25 0 01-1.658 0l-1.558-.623A2.25 2.25 0 013 15.568V14.25a2.25 2.25 0 012.25-2.25z" /></svg>
            <!-- Video Icon -->
            <svg *ngIf="service.icon === 'video'" class="w-6 h-6" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M6 20.25h12A2.25 2.25 0 0020.25 18V6A2.25 2.25 0 0018 3.75H6A2.25 2.25 0 003.75 6v12A2.25 2.25 0 006 20.25z" /><path stroke-linecap="round" stroke-linejoin="round" d="M15 10.5h.008v.008H15V10.5zm0 3h.008v.008H15v-.008zm-3-3h.008v.008H12V10.5zm0 3h.008v.008H12v-.008zm-3-3h.008v.008H9V10.5zm0 3h.008v.008H9v-.008z" /></svg>
            <!-- Wifi Icon -->
            <svg *ngIf="service.icon === 'wifi'" class="w-6 h-6" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M8.288 15.038a5.25 5.25 0 017.424 0M5.106 11.856a9.75 9.75 0 0113.788 0M1.924 8.674a14.25 14.25 0 0120.152 0M12.53 18.22l-.53.53-.53-.53a.75.75 0 011.06 0z" /></svg>
            <!-- Home Icon -->
            <svg *ngIf="service.icon === 'home'" class="w-6 h-6" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M2.25 12l8.954-8.955c.44-.439 1.152-.439 1.591 0L21.75 12M4.5 9.75v10.125c0 .621.504 1.125 1.125 1.125H9.75v-4.875c0-.621.504-1.125 1.125-1.125h2.25c.621 0 1.125.504 1.125 1.125V21h4.125c.621 0 1.125-.504 1.125-1.125V9.75M8.25 21h8.25" /></svg>
          </div>

          <!-- Text -->
          <h3 class="text-xl font-black text-slate-800 dark:text-slate-100 uppercase tracking-tight mb-2">{{ service.title }}</h3>
          <p class="text-xs text-slate-500 dark:text-slate-400 font-medium leading-relaxed mb-6">{{ service.description }}</p>
        </div>

        <div>
          <!-- Badge or Button -->
          <span
            *ngIf="service.comingSoon"
            class="inline-block bg-slate-100 dark:bg-slate-900 text-slate-400 text-[10px] font-black uppercase tracking-wider px-3.5 py-1.5 rounded-full"
          >
            Coming Soon
          </span>
          <a
            *ngIf="!service.comingSoon"
            routerLink="/services/book"
            [queryParams]="{ type: service.title.split(' ')[0].toUpperCase() }"
            class="inline-flex items-center text-[10px] font-black text-indigo-650 uppercase tracking-widest hover:text-indigo-800 transition-colors"
          >
            Request Diagnostic →
          </a>
        </div>
      </div>
    </div>
  </div>
</div>
