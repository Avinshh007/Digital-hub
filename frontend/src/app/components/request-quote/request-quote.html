<div class="min-h-screen bg-transparent pt-24 pb-16 px-4 sm:px-6 lg:px-8">
  <div class="max-w-xl mx-auto">
    
    <!-- Header -->
    <div class="border-b border-slate-200 dark:border-slate-800/80 pb-4 mb-8 text-center sm:text-left">
      <h1 class="text-3xl font-black text-slate-800 dark:text-slate-100 uppercase tracking-tight">Request Custom Quote</h1>
      <p class="text-xs text-slate-400 dark:text-slate-500 mt-1 uppercase font-semibold tracking-wider">
        Submit custom PC requirements, high-end hardware requests, or document spec sheets for pricing response
      </p>
    </div>

    <!-- Form -->
    <div class="glass-panel p-8 sm:p-10 rounded-[2.5rem] shadow-xl relative overflow-hidden">
      <div class="absolute top-0 right-0 w-24 h-24 bg-indigo-500/5 rounded-bl-full pointer-events-none"></div>

      <!-- Messages -->
      <div *ngIf="error()" class="bg-rose-50 dark:bg-rose-950/20 border border-rose-100 dark:border-rose-900/40 text-rose-600 dark:text-rose-400 p-4 rounded-2xl text-xs font-semibold mb-6 animate-fade-in">
        {{ error() }}
      </div>
      <div *ngIf="success()" class="bg-emerald-50 dark:bg-emerald-950/20 border border-emerald-100 dark:border-emerald-900/40 text-emerald-800 dark:text-emerald-400 p-4 rounded-2xl text-xs font-semibold mb-6 animate-fade-in">
        {{ success() }}
      </div>

      <form (submit)="handleSubmit($event)" class="space-y-6">
        <div>
          <label class="block text-[10px] font-black text-slate-400 dark:text-slate-500 uppercase tracking-widest mb-2">Customer Name</label>
          <input
            type="text"
            [(ngModel)]="customerName"
            name="customerName"
            required
            placeholder="e.g. Avinash"
            class="w-full bg-slate-100/50 dark:bg-slate-900/50 border border-slate-200 dark:border-slate-800 rounded-2xl py-3 px-4 text-sm font-semibold focus:outline-none focus:ring-2 focus:ring-indigo-600 text-slate-800 dark:text-slate-100 transition-all placeholder-slate-400"
          />
        </div>

        <div class="grid grid-cols-1 sm:grid-cols-2 gap-6">
          <div>
            <label class="block text-[10px] font-black text-slate-400 dark:text-slate-500 uppercase tracking-widest mb-2">Email Address</label>
            <input
              type="email"
              [(ngModel)]="email"
              name="email"
              required
              placeholder="e.g. customer@example.com"
              class="w-full bg-slate-100/50 dark:bg-slate-900/50 border border-slate-200 dark:border-slate-800 rounded-2xl py-3 px-4 text-sm font-semibold focus:outline-none focus:ring-2 focus:ring-indigo-600 text-slate-800 dark:text-slate-100 transition-all placeholder-slate-400"
            />
          </div>

          <div>
            <label class="block text-[10px] font-black text-slate-400 dark:text-slate-500 uppercase tracking-widest mb-2">Phone Number</label>
            <input
              type="tel"
              [(ngModel)]="phone"
              name="phone"
              required
              placeholder="10-digit number"
              class="w-full bg-slate-100/50 dark:bg-slate-900/50 border border-slate-200 dark:border-slate-800 rounded-2xl py-3 px-4 text-sm font-semibold focus:outline-none focus:ring-2 focus:ring-indigo-600 text-slate-800 dark:text-slate-100 transition-all placeholder-slate-400"
            />
          </div>
        </div>

        <div>
          <label class="block text-[10px] font-black text-slate-400 dark:text-slate-500 uppercase tracking-widest mb-2">Specifications Requirements Details</label>
          <textarea
            [(ngModel)]="requirements"
            name="requirements"
            required
            rows="5"
            placeholder="Type in your CPU, GPU, storage, motherboard requirements, accessories or special configuration preferences here..."
            class="w-full bg-slate-100/50 dark:bg-slate-900/50 border border-slate-200 dark:border-slate-800 rounded-2xl py-3 px-4 text-sm font-semibold focus:outline-none focus:ring-2 focus:ring-indigo-600 text-slate-800 dark:text-slate-100 transition-all placeholder-slate-400 resize-none"
          ></textarea>
        </div>

        <div>
          <label class="block text-[10px] font-black text-slate-400 dark:text-slate-500 uppercase tracking-widest mb-2">Upload Spec Sheet / Config Document Link (Optional)</label>
          <input
            type="text"
            [(ngModel)]="documentUrl"
            name="documentUrl"
            placeholder="e.g. http://link-to-spec-sheet.pdf"
            class="w-full bg-slate-100/50 dark:bg-slate-900/50 border border-slate-200 dark:border-slate-800 rounded-2xl py-3 px-4 text-sm font-semibold focus:outline-none focus:ring-2 focus:ring-indigo-600 text-slate-800 dark:text-slate-100 transition-all placeholder-slate-400"
          />
        </div>

        <button
          type="submit"
          [disabled]="loading()"
          class="w-full py-4 bg-indigo-600 hover:bg-indigo-700 disabled:bg-indigo-400 text-white text-xs font-black uppercase tracking-widest rounded-full shadow-lg hover:shadow-indigo-500/10 transition-all cursor-pointer flex items-center justify-center space-x-2"
        >
          <span *ngIf="!loading()">Submit Quote Request</span>
          <span *ngIf="loading()">Submitting...</span>
        </button>
      </form>

    </div>
  </div>
</div>
